# Integración continua de la landing (auditoría a producción, 2026-09-13).
#
# Es la única pieza de Atlas que ya es pública para cualquiera y no tenía ninguna comprobación.
# Empieza por lo que no admite discusión: que no entre un secreto y que el HTML sea válido.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  html:
    name: HTML válido
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar las páginas publicadas
        run: npx --yes html-validate@9 --formatter stylish index.html login.html registro.html

  # Guardia de promesas (auditoría de calidad, 2026-09-29). La landing es pública: no puede
  # afirmar lo que Atlas no hace (0 % de interés, cuotas quincenales, niveles, tiempos sin
  # métrica, testimonios...) ni tener enlaces a ninguna parte. check.py dice archivo, línea
  # y motivo; sin dependencias.
  promesas:
    name: Sin promesas inventadas ni enlaces muertos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar textos y enlaces
        run: python3 check.py

  # Escaneo de secretos del árbol (auditoría a producción, 2026-09-13). Este repositorio es
  # PÚBLICO: lo que entra en un commit queda indexado aunque se borre después. Corre antes de
  # instalar dependencias, así que sólo mira código de Atlas. Alcance: el árbol (`dir`), no el
  # historial; impide secretos NUEVOS. Las excepciones viven en la propia línea
  # (`// gitleaks:allow`) y .gitleaks.toml explica por qué no hay excepciones por ruta.
  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar gitleaks 8.30.1 (versión y checksum fijados)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks && rm gitleaks gitleaks.tar.gz
      - name: Escanear el árbol
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1
