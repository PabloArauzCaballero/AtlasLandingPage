# Cabeceras de seguridad de la landing (auditoría de seguridad 2026-10-09, LND-03).
#
# Se incluye en el `server` y en CADA `location` que tenga su propio `add_header`: en nginx un
# `add_header` en un bloque hijo ANULA todos los heredados (así se perdían nosniff y Referrer-Policy
# en /assets/). `always` las pone también en 404 y demás errores.
#
# CSP, medida contra lo que se copia a la imagen (index, login, registro y assets/):
# - script-src 'self': sin scripts en línea ni eval; three.min.js está autoalojado en assets/.
# - style-src: sólo hojas propias (las fuentes Sora y Manrope están autoalojadas en assets/fonts/
#   desde LND-05: nada se pide a Google). Los atributos `style="--d:..."` del HTML necesitan
#   style-src-attr 'unsafe-inline'; los elementos <style> en línea siguen prohibidos (style-src-elem).
# - img-src 'self' data:: style.css usa dos SVG `data:` como fondo.
# - font-src 'self': woff2 de assets/fonts/. connect-src 'self': nada pide datos fuera.
# - El mapa three.js dibuja en un <canvas> WebGL: no necesita blob:, workers ni conexiones.
# - Los enlaces a la app web y a las tiendas son navegaciones: la CSP no las limita.
# Sin upgrade-insecure-requests: TEST también se sirve por la IP en http y rompería los assets.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# El navegador sólo la respeta por https (por la IP en http la ignora).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
